<html>
	<head>
		<title>WebGL - Rotating Susan!</title>
	</head>
	<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
	<script src="https://jeromeetienne.github.io/AR.js/aframe/build/aframe-ar.js"></script>
	
	<body>
		<a-scene embedded arjs> 
			<a-marker preset="custom" type="pattern"  url="image/markers/pattern-mark1.patt">
			<a-image src="image/objects/Imagen1.png" position="0 0 0" rotation="-90 0 0"></a-image>
			</a-marker>

			<a-marker preset="custom" type="pattern"  url="image/markers/pattern-mark2.patt">
			<a-image src="image/objects/Imagen2.png" position="0 0 0" rotation="-90 0 0"></a-image>
			</a-marker>

			<a-marker preset="custom" type="pattern"  url="image/markers/pattern-mark3.patt">
			<a-image src="image/objects/Imagen3.png" position="0 0 0" rotation="-90 0 0"></a-image>
			</a-marker>

			<a-marker preset="custom" type="pattern"  url="image/markers/pattern-mark4.patt">
			<a-image src="image/objects/Imagen4.png" position="0 0 0" rotation="-90 0 0"></a-image>

			<a-marker preset="custom" type="pattern"  url="image/markers/pattern-mark5.patt">
			<a-entity
 				position="0 0 -5"
 				scale="1.0 1.0 1.0"
				rotation="0 90 0"
 				gltf-model="image/objects/Chaya.gltf"
 			></a-entity>
			</a-marker>

			<a-marker preset="custom" type="pattern"  url="image/markers/pattern-mark6.patt">
			<a-entity
 				position="0 0 0"
 				scale="0.01 0.01 0.01"
 				gltf-model="image/eye/scene.gltf"
 			></a-entity>
			</a-marker>

		</a-scene>
		
	</body>
</html>
